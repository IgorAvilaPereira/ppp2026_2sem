 codigo:`public interface Observer<T> {           // estilo do professor (genérico)
    void update(T t);
}

public interface Subject {
    void addObserver(Observer o);
    void removeObserver(Observer o);
    void notifyObservers();
}

public enum Status { PAGO, ENVIADO, ENTREGUE, CANCELADO }

public class Pedido implements Subject {
    private Status status;
    private List<Observer> observers = new ArrayList<>();

    public Status getStatus() { return status; }
    public void addObserver(Observer o)    { observers.add(o); }
    public void removeObserver(Observer o) { observers.remove(o); }

    public void notifyObservers() {
        for (Observer o : observers) o.update(this);  // manda o próprio pedido
    }
    public void changeState(Status novo) {
        this.status = novo;
        notifyObservers();                             // mudou -> avisa todos
    }
}

public class Cliente implements Observer<Pedido> {
    private String nome;
    public Cliente(String nome) { this.nome = nome; }
    public void update(Pedido p) {
        System.out.println(nome + ": novo status " + p.getStatus());
    }
}

// Main

p.addObserver(new ReceitaFederal());
p.changeState(Status.ENVIADO);`,

 codigo:`public interface Comando {
    void executar();
    void desfazer();
}

public class Impressora {                 // Receiver
    public void imprimir(String doc) { System.out.println("Imprimindo " + doc); }
    public void cancelar(String doc) { System.out.println("Cancelado " + doc); }
}

public class ImprimirCommand implements Comando {
    private Impressora impressora;        // guarda o receiver
    private String documento;             // e os dados da ação
    public ImprimirCommand(Impressora i, String d) { impressora = i; documento = d; }
    public void executar() { impressora.imprimir(documento); }
    public void desfazer() { impressora.cancelar(documento); }
}

public class Controle {                   // Invoker
    private Queue<Comando> fila = new LinkedList<>();
    private Stack<Comando> historico = new Stack<>();

    public void adicionar(Comando c) { fila.add(c); }
    public void executarTodos() {
        while (!fila.isEmpty()) {
            Comando c = fila.poll();
            c.executar();
            historico.push(c);
        }
    }
    public void desfazer() {
        if (!historico.isEmpty()) historico.pop().desfazer();
    }
}`,

 codigo:`public class Playlist implements Iterable<Musica> {
    private Musica[] musicas;                 // estrutura escondida

    public Playlist(Musica... musicas) { this.musicas = musicas; }

    public Iterator<Musica> iterator() { return new IteradorNormal(); }
    public Iterator<Musica> iteratorReverso() { return new IteradorReverso(); }

    private class IteradorNormal implements Iterator<Musica> {
        private int pos = 0;
        public boolean hasNext() { return pos < musicas.length; }
        public Musica next() { return musicas[pos++]; }
    }
    private class IteradorReverso implements Iterator<Musica> {
        private int pos = musicas.length - 1;
        public boolean hasNext() { return pos >= 0; }
        public Musica next() { return musicas[pos--]; }
    }
}

// Main
Iterator<Musica> it = playlist.iterator();
while (it.hasNext()) System.out.println(it.next());
for (Musica m : playlist) System.out.println(m);   // funciona por ser Iterable`,

public class Cafe implements Bebida {
    public String descricao() { return "Café"; }

    public double preco() { return bebida.preco() + 3.0; }

code:`public interface Observador { void atualizar(String status); }

public class Pedido {

    public void adicionarObservador(Observador o) { observadores.add(o); }
    public void removerObservador(Observador o)   { observadores.remove(o); }
    private void notificar() {

    }

}

}

code:`public interface Observer { void atualizar(double temperatura); }

public class EstacaoMeteorologica {
    private double temperatura;
    private List<Observer> observers = new ArrayList<>();

    public void adicionar(Observer o) { observers.add(o); }
    public void remover(Observer o)   { observers.remove(o); }
    public void setTemperatura(double t) {
        this.temperatura = t;
        for (Observer o : observers) o.atualizar(t);
    }
}

public class Painel implements Observer {

}
public class Alerta implements Observer {

}

code:`public interface Comando { void executar(); void desfazer(); }

public class Editor {
    private StringBuilder texto = new StringBuilder();
    public void inserir(String s) { texto.append(s); }
    public String remover(int n) {
        int ini = Math.max(0, texto.length() - n);
        String removido = texto.substring(ini);
        texto.delete(ini, texto.length());
        return removido;
    }
    public String getTexto() { return texto.toString(); }
}

public class InserirTextoCommand implements Comando {
    private Editor editor; private String s;
    public InserirTextoCommand(Editor e, String s) { editor = e; this.s = s; }
    public void executar() { editor.inserir(s); }
    public void desfazer() { editor.remover(s.length()); }
}

public class RemoverTextoCommand implements Comando {
    private Editor editor; private int n; private String removido;
    public RemoverTextoCommand(Editor e, int n) { editor = e; this.n = n; }
    public void executar() { removido = editor.remover(n); } // guarda o estado
    public void desfazer() { editor.inserir(removido); }
}

public class Invoker {
    private Stack<Comando> historico = new Stack<>();
    public void executar(Comando c) { c.executar(); historico.push(c); }
    public void desfazer() { if (!historico.isEmpty()) historico.pop().desfazer(); }
}`,dica:"O RemoverTextoCommand guarda o texto removido no executar() para conseguir desfazer. Esse detalhe mostra que você entendeu o undo."},

  if(!words.length) return t;
  const ranges=[];
  for(const w of words){ let k=nt.indexOf(w); while(k>=0){ranges.push([k,k+w.length]); k=nt.indexOf(w,k+w.length);} }
  if(!ranges.length) return t;
  ranges.sort((a,b)=>a[0]-b[0]);
  const merged=[]; for(const r of ranges){ if(merged.length&&r[0]<=merged[merged.length-1][1]) merged[merged.length-1][1]=Math.max(merged[merged.length-1][1],r[1]); else merged.push(r.slice()); }
  for(const [a,b] of merged){ out+=esc(raw.slice(i,a))+"<mark>"+esc(raw.slice(a,b))+"</mark>"; i=b; }
  return out+esc(raw.slice(i));
}
const KW = /\b(public|private|protected|class|interface|abstract|extends|implements|return|new|void|final|static|if|else|for|while|this|super|null|true|false|import|package|enum|try|catch|throw|throws)\b/;
const TY = /\b(String|double|int|boolean|List|ArrayList|LinkedList|Queue|Stack|Iterator|Iterable|Comparator|Arrays|StringBuilder|Math|System)\b/;
function hlJava(src){
  const re = /(\/\/[^\n]*)|("(?:[^"\\]|\\.)*")|\b([A-Za-z_]\w*)\b/g;
  let out="", last=0, m;
  while((m=re.exec(src))){
    out+=esc(src.slice(last,m.index)); last=re.lastIndex;
    if(m[1]) out+='<span class="cm">'+esc(m[1])+"</span>";
    else if(m[2]) out+='<span class="st">'+esc(m[2])+"</span>";
    else if(KW.test(m[3]) && m[3].match(KW)[0]===m[3]) out+='<span class="kw">'+m[3]+"</span>";
    else if(TY.test(m[3]) && m[3].match(TY)[0]===m[3]) out+='<span class="ty">'+m[3]+"</span>";
    else out+=esc(m[3]);
  }
  return out+esc(src.slice(last));
}

  return `<div class="view"><div style="display:grid;gap:8px"><span class="eyebrow">09_revisao/lista1 · código do professor</span><h2 style="font-size:1.8rem">Como o professor resolve</h2><p class="lead">O repositório recebeu as soluções do professor para a lista de revisão. Elas mostram o jeito que ele espera ver o código. Vale imitar a estrutura, inclusive nomes como update, addObserver e changeState.</p></div>
  <div class="grid">${ESTILO.map(s=>`<div class="card"><h3>${esc(s[0])}</h3><p style="margin:0">${esc(s[1])}</p></div>`).join("")}</div>
  <div class="note"><b>Para não repetir na prova:</b> a MainTemplateMethod chama gravacao() direto em vez de organizarTexto(), então o template não é usado; existem duas classes iguais de estado (ProdutoLiberado e LiberadoProduto); o estado Cancela não sai mais de si mesmo. São detalhes de um código feito ao vivo em aula, mas na prova eles podem custar pontos.</div></div>`;
}

function render(){
  renderTabs();
  const v=state.view; let html="";
  if(v==="busca") html=vBusca();
  else if(P[v]) html=vPadrao(v);
  else if(v==="exercicios") html=vExercicios();
  else if(v==="qual") html=vQual();
  else if(v==="comparar") html=vComparar();
  else if(v==="principios") html=vPrincipios();
  else if(v==="professor") html=vProfessor();
  $("#main").innerHTML=html;
  if(v==="qual") runIdf();
  if(state.focusAttr && P[v]){ const el=document.getElementById("a-"+state.focusAttr); if(el) setTimeout(()=>el.scrollIntoView({block:"center"}),0); }
}

/* ===================== EVENTOS ===================== */
$("#searchForm").addEventListener("submit",e=>e.preventDefault());
$("#q").addEventListener("input",e=>{ state.q=e.target.value; if(state.view!=="busca"){state.view="busca";} state.focusAttr=null; render(); });
$("#attrSel").addEventListener("change",e=>{ state.attr=e.target.value; try{localStorage.setItem("ppp-guia",JSON.stringify({attr:state.attr}));}catch(_){} state.view="busca"; render(); });
document.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.tab){ go(b.dataset.tab,{focusAttr:null,ex:null}); return; }
  if(b.dataset.pf){ const id=b.dataset.pf; state.pfilter.has(id)?state.pfilter.delete(id):state.pfilter.add(id); render(); return; }
  if(b.dataset.attr){ state.attr = state.attr===b.dataset.attr?"tudo":b.dataset.attr; renderAttrSel(); render(); return; }
  if(b.dataset.quick){ const [t,a]=b.dataset.quick.split("|"); state.q=t; state.attr=a; $("#q").value=t; renderAttrSel(); render(); return; }
  if(b.dataset.go){ const [tipo,alvo,attr]=b.dataset.go.split("|");
    if(tipo==="padrao") go(alvo,{focusAttr:attr==="cat"?null:attr});
    else if(tipo==="ex") go("exercicios",{ex:+alvo,showSol:attr==="codigo"});
    else if(tipo==="cmp") go("comparar");
    else if(tipo==="princ") go("principios");
    else if(tipo==="estilo") go("professor");
    return; }
  if(b.dataset.ex){ go("exercicios",{ex:+b.dataset.ex,showSol:false}); return; }
  if(b.dataset.exback){ go("exercicios",{ex:null}); return; }
  if(b.dataset.sol){ state.showSol=!state.showSol; render(); return; }
  if(b.dataset.sample){ $("#enun").value=SAMPLES[+b.dataset.sample]; runIdf(); return; }
  if(b.dataset.copy){ const pre=document.getElementById(b.dataset.copy); const txt=pre.innerText;
    const done=()=>{b.textContent="Copiado"; setTimeout(()=>b.textContent="Copiar",1400);};
    try{ navigator.clipboard.writeText(txt).then(done,()=>{selectEl(pre);b.textContent="Selecionado, use Ctrl+C";}); }catch(_){ selectEl(pre); b.textContent="Selecionado, use Ctrl+C"; }
  }
});
document.addEventListener("input",e=>{ if(e.target.id==="enun") runIdf(); });
function selectEl(el){ const r=document.createRange(); r.selectNodeContents(el); const s=getSelection(); s.removeAllRanges(); s.addRange(r); }

renderAttrSel(); render();
</script>

</body></html>
